services:
  postgres:
    image: postgres:17-alpine
    container_name: noverdinho-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: noverdinho
      POSTGRES_PASSWORD: noverdinho
      POSTGRES_DB: noverdinho
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U noverdinho']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: noverdinho-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: noverdinho-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://noverdinho:noverdinho@postgres:5432/noverdinho
      REDIS_HOST: redis
      PORT: 3333
    ports:
      - '3333:3333'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npx prisma db seed && node dist/main.js"

volumes:
  pgdata: