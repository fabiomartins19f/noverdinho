name: NoVerdinho
options:
  bundleIdPrefix: br.com.noverdinho
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 7.1.0
settings:
  base:
    SWIFT_VERSION: "5.10"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_CFBundleDisplayName: No Verdinho
    INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
    INFOPLIST_KEY_UIUserInterfaceStyle: Dark
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    ENABLE_PREVIEWS: YES
    PRODUCT_BUNDLE_IDENTIFIER: br.com.noverdinho.ios
    TARGETED_DEVICE_FAMILY: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_NSFaceIDUsageDescription: "Usamos o Face ID para proteger o acesso às suas finanças."
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: N8VSB7DMCQ
    INFOPLIST_FILE: NoVerdinho/Info.plist
  configs:
    debug:
      ENABLE_TESTABILITY: YES
targets:
  NoVerdinho:
    type: application
    platform: iOS
    sources:
      - path: NoVerdinho
    dependencies:
      - package: GoogleSignIn
  NoVerdinhoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/NoVerdinhoTests
    dependencies:
      - target: NoVerdinho
schemes:
  NoVerdinho:
    build:
      targets:
        NoVerdinho: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - NoVerdinhoTests
